name: Bootstrap Spec Kit

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/bootstrap-spec-kit.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install GitHub Spec Kit
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v1.0.7

      - name: Verify Spec Kit
        run: specify version

      - name: Initialize Spec Kit with Codex integration
        run: >-
          specify init --here --force --non-interactive
          --integration codex --ignore-agent-tools --script sh

      - name: Commit generated Spec Kit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specify .agents
          if git diff --cached --quiet; then
            echo "No generated files to commit."
            exit 0
          fi
          git commit -m "chore: initialize GitHub Spec Kit with Codex"
          git push
