name: Fix float clarification numbering

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/clarify-float-format.yml

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix acceptance scenario numbering
        shell: python
        run: |
          from pathlib import Path

          path = Path("specs/001-env-validation/spec.md")
          text = path.read_text()
          old = "3. **Given** a float variable contains a finite decimal or scientific-notation value such as `1.5`"
          new = "2. **Given** a float variable contains a finite decimal or scientific-notation value such as `1.5`"
          if old not in text:
              raise SystemExit("Float acceptance scenario not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Commit numbering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-env-validation/spec.md
          git commit -m "docs: fix clarification scenario numbering"
          git push
