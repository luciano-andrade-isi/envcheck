name: US1 Green Final

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/us1-green-final.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          for n in $(seq -w 1 14); do grep -Eq -- "^- \[[Xx]\] T0${n}\\b" specs/001-env-validation/tasks.md; done
          for n in 15 16 17 18; do grep -F -- "- [ ] T0${n} " specs/001-env-validation/tasks.md; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('specs/001-env-validation/checklists').glob('*.md'):
              if re.search(r'^- \[ \] ', path.read_text(), flags=re.M):
                  raise SystemExit(f'unchecked checklist item in {path}')
          PY
          test ! -e .specify/extensions.yml

      - name: Run required validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo test --test cli

      - name: Verify unreadable-file safety
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'APP_NAME=synthetic-target-secret\n' > "$tmp/.env"
          printf 'APP_NAME=ignored\n' > "$tmp/.env.example"
          set +e
          cargo run --quiet -- "$tmp/missing.env" --example "$tmp/.env.example" >"$tmp/out1" 2>"$tmp/err1"; s1=$?
          cargo run --quiet -- "$tmp/.env" --example "$tmp/missing.example" >"$tmp/out2" 2>"$tmp/err2"; s2=$?
          set -e
          test "$s1" -eq 3
          test "$s2" -eq 3
          grep -F "$tmp/missing.env" "$tmp/err1"
          grep -F 'required file could not be read' "$tmp/err1"
          grep -F "$tmp/missing.example" "$tmp/err2"
          grep -F 'required file could not be read' "$tmp/err2"
          ! grep -F 'synthetic-target-secret' "$tmp/out1" "$tmp/err1" "$tmp/out2" "$tmp/err2"

      - name: Mark T015-T017 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-env-validation/tasks.md')
          text = path.read_text()
          for task in ('T015','T016','T017'):
              old = f'- [ ] {task} '
              if text.count(old) != 1:
                  raise SystemExit(f'expected one unchecked {task}')
              text = text.replace(old, f'- [X] {task} ', 1)
          if '- [ ] T018 ' not in text:
              raise SystemExit('T018 must remain unchecked')
          path.write_text(text)
          PY

      - name: Final verify and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/us1-green.yml
          rm .github/workflows/us1-green-validate.yml
          rm .github/workflows/us1-green-final.yml
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo test --test cli
          test ! -e .specify/extensions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: validate env files against env example'
          git push origin HEAD:chore/init-spec-kit
