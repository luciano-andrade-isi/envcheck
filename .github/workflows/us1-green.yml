name: US1 Green

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/us1-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify prerequisites and checklist gate
        shell: bash
        run: |
          set -euo pipefail
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          for n in $(seq -w 1 14); do
            grep -Eq -- "^- \[[Xx]\] T0${n}\\b" specs/001-env-validation/tasks.md
          done
          grep -F -- '- [ ] T015 ' specs/001-env-validation/tasks.md
          grep -F -- '- [ ] T016 ' specs/001-env-validation/tasks.md
          grep -F -- '- [ ] T017 ' specs/001-env-validation/tasks.md
          grep -F -- '- [ ] T018 ' specs/001-env-validation/tasks.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path('specs/001-env-validation/checklists').glob('*.md')):
              text = path.read_text()
              total = len(re.findall(r'^- \[(?: |X|x)\] ', text, flags=re.M))
              checked = len(re.findall(r'^- \[(?:X|x)\] ', text, flags=re.M))
              unchecked = len(re.findall(r'^- \[ \] ', text, flags=re.M))
              print(f'{path.name}: total={total} checked={checked} unchecked={unchecked}')
              if unchecked:
                  raise SystemExit(f'Checklist gate failed: {path} has {unchecked} unchecked items')
          PY
          test ! -e .specify/extensions.yml
          git rev-parse --git-dir >/dev/null
          grep -Eq '^(target|target/|/target/?)$' .gitignore

      - name: Implement T015 example presence rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/validation/rules/presence.rs')
          tests = path.read_text()
          if not tests.startswith('#[cfg(test)]'):
              raise SystemExit('presence.rs no longer has expected RED-test-only shape')
          production = r'''use crate::env::EnvDocument;
          use crate::validation::error::{Diagnostic, RuleCode, Severity};
          use crate::validation::ValidationResult;

          pub(crate) fn validate_example_presence(
              target: &EnvDocument,
              example: &EnvDocument,
          ) -> ValidationResult {
              let mut diagnostics = Vec::new();

              add_duplicate_diagnostics(target, "target", &mut diagnostics);
              add_duplicate_diagnostics(example, "example", &mut diagnostics);

              for (key, indexes) in &example.key_index {
                  if target.key_index.contains_key(key) {
                      continue;
                  }

                  diagnostics.push(Diagnostic {
                      severity: Severity::Error,
                      code: RuleCode::MissingRequired,
                      variable: Some(key.clone()),
                      rule: "required variable is missing".to_owned(),
                      expected: Some("variable to be present".to_owned()),
                      line: indexes
                          .first()
                          .and_then(|index| example.entries.get(*index))
                          .map(|entry| entry.line),
                  });
              }

              for (key, indexes) in &target.key_index {
                  if example.key_index.contains_key(key) {
                      continue;
                  }

                  diagnostics.push(Diagnostic {
                      severity: Severity::Warning,
                      code: RuleCode::AdditionalVariable,
                      variable: Some(key.clone()),
                      rule: "variable is not declared in example".to_owned(),
                      expected: None,
                      line: indexes
                          .first()
                          .and_then(|index| target.entries.get(*index))
                          .map(|entry| entry.line),
                  });
              }

              ValidationResult { diagnostics }
          }

          fn add_duplicate_diagnostics(
              document: &EnvDocument,
              document_kind: &str,
              diagnostics: &mut Vec<Diagnostic>,
          ) {
              for (key, indexes) in &document.key_index {
                  if indexes.len() < 2 {
                      continue;
                  }

                  diagnostics.push(Diagnostic {
                      severity: Severity::Error,
                      code: RuleCode::DuplicateKey,
                      variable: Some(key.clone()),
                      rule: format!("duplicate variable declaration in {document_kind}"),
                      expected: Some("a single declaration".to_owned()),
                      line: indexes
                          .get(1)
                          .and_then(|index| document.entries.get(*index))
                          .map(|entry| entry.line),
                  });
              }
          }

          '''
          path.write_text(production + tests)
          PY

      - name: Implement T016 example validation orchestration
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/validator.rs <<'RS'
          use crate::env::EnvDocument;

          use super::ValidationResult;
          use super::rules::presence::validate_example_presence;

          pub(crate) fn validate_example(target: &EnvDocument, example: &EnvDocument) -> ValidationResult {
              let mut result = validate_example_presence(target, example);
              result.sort_diagnostics();
              result
          }
          RS

      - name: Implement T017 explicit example CLI flow
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main.rs <<'RS'
          use std::fmt;
          use std::fs;
          use std::path::{Path, PathBuf};
          use std::process::ExitCode;

          use clap::Parser;

          mod cli;
          mod env;
          mod output;
          mod schema;
          mod validation;

          pub(crate) const EXIT_SUCCESS: u8 = 0;
          pub(crate) const EXIT_VALIDATION_ERROR: u8 = 1;
          #[allow(dead_code)]
          pub(crate) const EXIT_CLI_USAGE_ERROR: u8 = 2;
          pub(crate) const EXIT_INPUT_ERROR: u8 = 3;
          #[allow(dead_code)]
          pub(crate) const EXIT_SCHEMA_ERROR: u8 = 4;

          #[allow(dead_code)]
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum FailureCategory {
              Input,
              Discovery,
              Dotenv,
              Schema,
          }

          impl fmt::Display for FailureCategory {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let name = match self {
                      Self::Input => "input",
                      Self::Discovery => "discovery",
                      Self::Dotenv => "dotenv",
                      Self::Schema => "schema",
                  };
                  formatter.write_str(name)
              }
          }

          #[allow(dead_code)]
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum SafeFailureReason {
              UnreadableFile,
              NoValidationDefinition,
              InvalidDotenvSyntax,
              InvalidSchemaSyntax,
              InvalidSchemaDefinition,
          }

          impl fmt::Display for SafeFailureReason {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let reason = match self {
                      Self::UnreadableFile => "required file could not be read",
                      Self::NoValidationDefinition => "no validation definition is available",
                      Self::InvalidDotenvSyntax => "invalid dotenv syntax",
                      Self::InvalidSchemaSyntax => "invalid schema syntax",
                      Self::InvalidSchemaDefinition => "invalid schema definition",
                  };
                  formatter.write_str(reason)
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct PreventingFailure {
              pub(crate) category: FailureCategory,
              pub(crate) path: PathBuf,
              pub(crate) reason: SafeFailureReason,
              pub(crate) line: Option<usize>,
              pub(crate) column: Option<usize>,
          }

          fn main() -> ExitCode {
              let cli = cli::Cli::parse();

              if let Some(example_path) = cli.example.as_deref() {
                  return run_explicit_example(&cli.env_file, example_path);
              }

              // Validator discovery and schema execution are intentionally implemented by later tasks.
              let _ = cli.schema;
              ExitCode::from(EXIT_SUCCESS)
          }

          fn run_explicit_example(target_path: &Path, example_path: &Path) -> ExitCode {
              let target_text = match read_input(target_path) {
                  Ok(text) => text,
                  Err(failure) => return preventing_exit(failure),
              };
              let example_text = match read_input(example_path) {
                  Ok(text) => text,
                  Err(failure) => return preventing_exit(failure),
              };

              let target = match env::parser::parse_dotenv(target_path, &target_text) {
                  Ok(document) => document,
                  Err(error) => return preventing_exit(dotenv_failure(error)),
              };
              let example = match env::parser::parse_dotenv(example_path, &example_text) {
                  Ok(document) => document,
                  Err(error) => return preventing_exit(dotenv_failure(error)),
              };

              let result = validation::validator::validate_example(&target, &example);
              let exit = if result.has_errors() {
                  EXIT_VALIDATION_ERROR
              } else {
                  EXIT_SUCCESS
              };
              let _ = output::write_validation_stdout(&result);
              ExitCode::from(exit)
          }

          fn read_input(path: &Path) -> Result<String, PreventingFailure> {
              fs::read_to_string(path).map_err(|_| PreventingFailure {
                  category: FailureCategory::Input,
                  path: path.to_path_buf(),
                  reason: SafeFailureReason::UnreadableFile,
                  line: None,
                  column: None,
              })
          }

          fn dotenv_failure(error: env::parser::DotenvParseError) -> PreventingFailure {
              PreventingFailure {
                  category: FailureCategory::Dotenv,
                  path: error.path,
                  reason: SafeFailureReason::InvalidDotenvSyntax,
                  line: error.line,
                  column: error.column,
              }
          }

          fn preventing_exit(failure: PreventingFailure) -> ExitCode {
              let _ = output::write_preventing_stderr(&failure);
              ExitCode::from(EXIT_INPUT_ERROR)
          }
          RS

      - name: Format and validate US1
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo test --test cli

      - name: Mark only T015 through T017 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('specs/001-env-validation/tasks.md')
          text = path.read_text()
          for task in ('T015', 'T016', 'T017'):
              old = f'- [ ] {task} '
              new = f'- [X] {task} '
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unchecked {task}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          checked = re.findall(r'^- \[(?:X|x)\] (T\d{3})\b', text, flags=re.M)
          expected = [f'T{i:03d}' for i in range(1, 18)]
          if checked[:17] != expected:
              raise SystemExit(f'Unexpected first checked tasks: {checked[:17]}')
          if '- [ ] T018 ' not in text:
              raise SystemExit('T018 must remain unchecked')
          print('Checked through:', ', '.join(expected))
          PY

      - name: Verify scope, post-hooks state, and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/us1-green.yml
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo test --test cli
          test ! -e .specify/extensions.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/validation/rules/presence.rs',
              'src/validation/validator.rs',
              'src/main.rs',
              'specs/001-env-validation/tasks.md',
              '.github/workflows/us1-green.yml',
          }
          paths = []
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          unexpected = sorted(set(paths) - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {unexpected}')
          print('Changed paths:', ', '.join(paths))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: validate env files against env example'
          git push origin HEAD:chore/init-spec-kit
