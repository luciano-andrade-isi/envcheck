name: Apply variable-name syntax clarification

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/clarify-variable-name-syntax.yml

permissions:
  contents: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update specification
        shell: python
        run: |
          from pathlib import Path

          path = Path("specs/001-env-validation/spec.md")
          text = path.read_text()

          old = "- Q: Which representations should be accepted for `float` values? → A: Accept finite decimal and scientific-notation values; reject `NaN` and positive or negative infinity.\n"
          new = old + "- Q: Which variable names should be considered valid in `.env` and `.env.example`? → A: Names must match `[A-Za-z_][A-Za-z0-9_]*`; the same identifier rule applies to variable names declared by `.env.schema`.\n"
          if old not in text:
              raise SystemExit("Clarifications insertion point not found")
          text = text.replace(old, new, 1)

          old = "7. **Given** one file declares `PORT` and another declares `port`, **When** validation compares\n   variable names, **Then** they are treated as distinct variables on every supported platform.\n"
          new = old + "8. **Given** a variable name starts with a digit or contains characters other than letters, digits,\n   and `_`, **When** the file or schema is parsed, **Then** the identifier is rejected as invalid; a\n   valid name starts with a letter or `_` and continues only with letters, digits, or `_`.\n"
          if old not in text:
              raise SystemExit("Acceptance insertion point not found")
          text = text.replace(old, new, 1)

          old = "- Variable names that differ only by letter case, such as `PORT` and `port`, are distinct.\n"
          new = old + "- Variable names must match `[A-Za-z_][A-Za-z0-9_]*`; names such as `1PORT`, `APP-NAME`,\n  and `APP.NAME` are invalid.\n"
          if old not in text:
              raise SystemExit("Edge-case insertion point not found")
          text = text.replace(old, new, 1)

          old = "- **FR-011**: The parser MUST distinguish a missing variable from a declared variable with an empty\n  value. Variable names MUST be treated as case-sensitive identifiers for parsing, duplicate\n  detection, example-file matching, and schema matching on Linux, macOS, and Windows.\n"
          new = "- **FR-011**: The parser MUST distinguish a missing variable from a declared variable with an empty\n  value. Variable names MUST match `[A-Za-z_][A-Za-z0-9_]*` and MUST be treated as case-sensitive\n  identifiers for parsing, duplicate detection, example-file matching, and schema matching on Linux,\n  macOS, and Windows. Variable names declared by `.env.schema` MUST follow the same identifier rule.\n"
          if old not in text:
              raise SystemExit("FR-011 replacement point not found")
          text = text.replace(old, new, 1)

          old = "- Dotenv parsing follows common semantics for comments, blank lines, quoted values, and `export`\n  prefixes, while interpolation is deliberately disabled. Non-empty, non-comment lines that are not\n  valid dotenv declarations are errors rather than ignored input.\n"
          new = old + "- Environment variable identifiers use the portable form `[A-Za-z_][A-Za-z0-9_]*` across target,\n  example, and schema definitions.\n"
          if old not in text:
              raise SystemExit("Assumption insertion point not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit specification clarification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-env-validation/spec.md
          git commit -m "docs: clarify variable name syntax"
          git push
