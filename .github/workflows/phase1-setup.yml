name: Phase 1 Setup

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/phase1-setup.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Spec Kit prerequisites and checklist gate
        shell: bash
        run: |
          set -euo pipefail
          echo '--- check-prerequisites ---'
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks

          echo '--- verify T001/T002 remain setup tasks ---'
          grep -F -- '- [ ] T001 Initialize the `envcheck` Cargo binary package with Rust edition 2024' specs/001-env-validation/tasks.md
          grep -F -- '- [ ] T002 Create the planned module/file skeleton' specs/001-env-validation/tasks.md

          echo '--- verify reviewer-owned checklists are complete ---'
          python3 - <<'PY'
          from pathlib import Path
          import re

          checklists = Path('specs/001-env-validation/checklists')
          for path in sorted(checklists.glob('*.md')):
              text = path.read_text()
              total = len(re.findall(r'^- \[(?: |x|X)\] ', text, flags=re.M))
              unchecked = len(re.findall(r'^- \[ \] ', text, flags=re.M))
              checked = total - unchecked
              print(f'{path.name}: total={total} checked={checked} unchecked={unchecked}')
              if unchecked:
                  raise SystemExit(f'Checklist gate failed: {path}')
          PY

          echo '--- verify repository state before Phase 1 ---'
          test ! -e Cargo.toml
          test ! -d src

      - name: Implement T001 and T002 only
        shell: bash
        run: |
          set -euo pipefail

          cargo init --bin --name envcheck --edition 2024 .
          cargo add clap@4 --features derive
          cargo add serde@1 --features derive
          cargo add toml@1
          cargo add regex@1
          cargo add dotenvx-primitives
          cargo add --dev assert_cmd
          cargo add --dev tempfile

          mkdir -p src/env src/schema src/validation/rules src/output tests

          cat > src/main.rs <<'RS'
          mod cli;
          mod env;
          mod output;
          mod schema;
          mod validation;

          fn main() {}
          RS

          cat > src/cli.rs <<'RS'
          // Placeholder module for the CLI model. Behavior begins in Phase 2.
          RS

          cat > src/env/mod.rs <<'RS'
          pub(crate) mod parser;
          RS

          cat > src/env/parser.rs <<'RS'
          // Placeholder module for dotenv parsing. Behavior begins in Phase 2.
          RS

          cat > src/schema/mod.rs <<'RS'
          pub(crate) mod model;
          pub(crate) mod parser;
          RS

          cat > src/schema/model.rs <<'RS'
          // Placeholder module for schema data structures. Behavior begins in Phase 4.
          RS

          cat > src/schema/parser.rs <<'RS'
          // Placeholder module for schema parsing. Behavior begins in Phase 4.
          RS

          cat > src/validation/mod.rs <<'RS'
          pub(crate) mod error;
          pub(crate) mod rules;
          pub(crate) mod validator;
          RS

          cat > src/validation/validator.rs <<'RS'
          // Placeholder module for validation orchestration. Behavior begins in later phases.
          RS

          cat > src/validation/error.rs <<'RS'
          // Placeholder module for validation diagnostics. Behavior begins in Phase 2.
          RS

          cat > src/validation/rules/mod.rs <<'RS'
          pub(crate) mod allowed;
          pub(crate) mod length;
          pub(crate) mod numeric;
          pub(crate) mod pattern;
          pub(crate) mod presence;
          pub(crate) mod value_type;
          RS

          cat > src/validation/rules/presence.rs <<'RS'
          // Placeholder module for presence rules. Behavior begins in later phases.
          RS

          cat > src/validation/rules/value_type.rs <<'RS'
          // Placeholder module for scalar type rules. Behavior begins in later phases.
          RS

          cat > src/validation/rules/numeric.rs <<'RS'
          // Placeholder module for numeric rules. Behavior begins in later phases.
          RS

          cat > src/validation/rules/length.rs <<'RS'
          // Placeholder module for string-length rules. Behavior begins in later phases.
          RS

          cat > src/validation/rules/allowed.rs <<'RS'
          // Placeholder module for allowed-value rules. Behavior begins in later phases.
          RS

          cat > src/validation/rules/pattern.rs <<'RS'
          // Placeholder module for pattern rules. Behavior begins in later phases.
          RS

          cat > src/output/mod.rs <<'RS'
          // Placeholder module for output rendering. Behavior begins in Phase 2.
          RS

          cat > tests/cli.rs <<'RS'
          // Compiled-CLI integration tests begin in later phases.
          RS

      - name: Validate Phase 1
        shell: bash
        run: |
          set -euo pipefail
          echo '--- cargo metadata ---'
          cargo metadata --format-version 1 > /tmp/envcheck-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/envcheck-metadata.json'))
          package = next(p for p in data['packages'] if p['name'] == 'envcheck')
          print(f"package={package['name']} version={package['version']} edition={package['edition']}")
          print('dependencies=' + ','.join(sorted(d['name'] for d in package['dependencies'])))
          PY

          echo '--- cargo check ---'
          cargo check

          echo '--- cargo fmt --check ---'
          cargo fmt --check

      - name: Mark only T001 and T002 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('specs/001-env-validation/tasks.md')
          text = path.read_text()
          for task in ('T001', 'T002'):
              old = f'- [ ] {task} '
              new = f'- [X] {task} '
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unchecked {task}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          updated = path.read_text()
          checked_ids = re.findall(r'^- \[(?:X|x)\] (T\d{3})\b', updated, flags=re.M)
          if checked_ids != ['T001', 'T002']:
              raise SystemExit(f'Unexpected checked task IDs: {checked_ids}')
          print('Checked task IDs:', ', '.join(checked_ids))
          PY

      - name: Verify final scope and commit
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/phase1-setup.yml

          echo '--- final changed paths ---'
          git status --short

          python3 - <<'PY'
          import subprocess

          allowed_prefixes = (
              'Cargo.toml',
              'Cargo.lock',
              'src/',
              'tests/cli.rs',
              'specs/001-env-validation/tasks.md',
              '.github/workflows/phase1-setup.yml',
          )
          paths = []
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          unexpected = [p for p in paths if not any(p == a or p.startswith(a) for a in allowed_prefixes)]
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {unexpected}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: initialize envcheck rust project'
          git push origin HEAD:chore/init-spec-kit
