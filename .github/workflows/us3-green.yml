name: US3 Green
on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/us3-green.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify prerequisites
        run: |
          set -euo pipefail
          test ! -e .specify/extensions.yml
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          python3 -c "from pathlib import Path; import re; files=list(Path('specs/001-env-validation/checklists').glob('*.md')); assert all(not re.findall(r'^- \[ \] ', p.read_text(), flags=re.M) for p in files)"
          python3 -c "from pathlib import Path; t=Path('specs/001-env-validation/tasks.md').read_text(); assert all(f'- [X] T{i:03d}' in t for i in range(1,40)); assert all(f'- [ ] T{i:03d}' in t for i in range(40,44))"
      - name: Implement T040-T043
        env:
          PARSER_PREFIX_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          model = Path('src/schema/model.rs')
          text = model.read_text()
          text = text.replace('#[derive(Clone, Debug, PartialEq, Deserialize)]\npub(crate) struct SchemaDefinition {', '#[derive(Clone, Debug, PartialEq, Deserialize)]\n#[serde(deny_unknown_fields)]\npub(crate) struct SchemaDefinition {', 1)
          text = text.replace('#[derive(Clone, Debug, PartialEq, Deserialize)]\npub(crate) struct VariableRule {', '#[derive(Clone, Debug, PartialEq, Deserialize)]\n#[serde(deny_unknown_fields)]\npub(crate) struct VariableRule {', 1)
          model.write_text(text)
          parser = Path('src/schema/parser.rs')
          current = parser.read_text()
          marker = '#[cfg(test)]\nmod tests {'
          assert marker in current
          tests = marker + current.split(marker, 1)[1]
          prefix = base64.b64decode(os.environ['PARSER_PREFIX_B64']).decode()
          parser.write_text(prefix + tests)
          main = Path('src/main.rs')
          text = main.read_text()
          old = 'fn schema_failure(error: schema::parser::SchemaParseError) -> PreventingFailure {\n    PreventingFailure {\n        category: FailureCategory::Schema,\n        path: error.path,\n        reason: SafeFailureReason::InvalidSchemaDefinition,\n        line: error.line,\n        column: error.column,\n    }\n}\n'
          new = 'fn schema_failure(error: schema::parser::SchemaParseError) -> PreventingFailure {\n    let reason = match error.kind {\n        schema::parser::SchemaErrorKind::Syntax => SafeFailureReason::InvalidSchemaSyntax,\n        schema::parser::SchemaErrorKind::Definition => SafeFailureReason::InvalidSchemaDefinition,\n    };\n    PreventingFailure {\n        category: FailureCategory::Schema,\n        path: error.path,\n        reason,\n        line: error.line,\n        column: error.column,\n    }\n}\n'
          assert old in text
          main.write_text(text.replace(old, new, 1))
          PY
      - name: Validate US1-US3
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          cargo test --test cli
      - name: Mark T040-T043 and commit
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('specs/001-env-validation/tasks.md'); t=p.read_text(); [(_ for _ in ()).throw(AssertionError()) if f'- [ ] T{i:03d}' not in t else None for i in range(40,44)]; t=''.join(t.replace(f'- [ ] T{i:03d}', f'- [X] T{i:03d}', 1) if i==40 else '' for i in []) if False else t; [None for _ in ()]; p.write_text(__import__('functools').reduce(lambda s,i:s.replace(f'- [ ] T{i:03d}',f'- [X] T{i:03d}',1), range(40,44), t))"
          grep -q -- '- \[ \] T044' specs/001-env-validation/tasks.md
          test ! -e .specify/extensions.yml
          rm .github/workflows/us3-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/schema/model.rs src/schema/parser.rs src/main.rs specs/001-env-validation/tasks.md .github/workflows/us3-green.yml
          git commit -m "feat: validate env schema definitions"
          git push origin HEAD:chore/init-spec-kit
