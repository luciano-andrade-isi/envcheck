name: US2 RED

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/us2-red.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify prerequisites and checklist gate
        shell: bash
        run: |
          set -euo pipefail
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          for n in $(seq -w 1 17); do
            grep -Eq -- "^- \[[Xx]\] T0${n}\\b" specs/001-env-validation/tasks.md
          done
          for n in $(seq -w 18 26); do
            grep -F -- "- [ ] T0${n} " specs/001-env-validation/tasks.md
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path('specs/001-env-validation/checklists').glob('*.md')):
              text = path.read_text()
              total = len(re.findall(r'^- \[(?: |X|x)\] ', text, flags=re.M))
              checked = len(re.findall(r'^- \[(?:X|x)\] ', text, flags=re.M))
              unchecked = len(re.findall(r'^- \[ \] ', text, flags=re.M))
              print(f'{path.name}: total={total} checked={checked} unchecked={unchecked}')
              if unchecked:
                  raise SystemExit(f'Checklist gate failed: {path} has {unchecked} unchecked items')
          PY
          test ! -e .specify/extensions.yml
          git rev-parse --git-dir >/dev/null
          grep -Eq '^(target|target/|/target/?)$' .gitignore

      - name: Author T018 schema model tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/schema/model.rs <<'RS'
          // Placeholder module for schema data structures. Behavior begins in Phase 4.

          #[cfg(test)]
          mod tests {
              use super::{SchemaDefinition, SchemaScalar, VariableRule, VariableType};

              fn parse_schema(input: &str) -> SchemaDefinition {
                  toml::from_str(input).expect("schema should deserialize")
              }

              #[test]
              fn deserializes_schema_definition_variable_rules_types_and_scalar_kinds() {
                  let schema = parse_schema(
                      r#"
          version = 1

          [variables.APP_NAME]
          type = "string"
          required = true
          allow_empty = true
          min_length = 2
          max_length = 20
          allowed = ["dev", "prod"]
          pattern = "^[a-z]+$"

          [variables.APP_PORT]
          type = "integer"
          min = -10
          max = 10
          allowed = [-10, 0, 10]

          [variables.RATIO]
          type = "float"
          min = 1
          max = 2.5
          allowed = [1, 1.5, 2]

          [variables.DEBUG]
          type = "boolean"
          allowed = [true, false]
          "#,
                  );

                  assert_eq!(schema.version, 1);
                  assert_eq!(schema.variables.len(), 4);

                  let string_rule: &VariableRule = &schema.variables["APP_NAME"];
                  assert_eq!(string_rule.r#type, VariableType::String);
                  assert!(string_rule.required);
                  assert!(string_rule.allow_empty);
                  assert_eq!(string_rule.min_length, Some(2));
                  assert_eq!(string_rule.max_length, Some(20));
                  assert_eq!(string_rule.pattern.as_deref(), Some("^[a-z]+$"));
                  assert_eq!(
                      string_rule.allowed.as_deref(),
                      Some(
                          [
                              SchemaScalar::String("dev".to_owned()),
                              SchemaScalar::String("prod".to_owned()),
                          ]
                          .as_slice()
                      )
                  );

                  let integer_rule = &schema.variables["APP_PORT"];
                  assert_eq!(integer_rule.r#type, VariableType::Integer);
                  assert_eq!(integer_rule.min, Some(SchemaScalar::Integer(-10)));
                  assert_eq!(integer_rule.max, Some(SchemaScalar::Integer(10)));
                  assert_eq!(
                      integer_rule.allowed.as_deref(),
                      Some(
                          [
                              SchemaScalar::Integer(-10),
                              SchemaScalar::Integer(0),
                              SchemaScalar::Integer(10),
                          ]
                          .as_slice()
                      )
                  );

                  let float_rule = &schema.variables["RATIO"];
                  assert_eq!(float_rule.r#type, VariableType::Float);
                  assert_eq!(float_rule.min, Some(SchemaScalar::Integer(1)));
                  assert_eq!(float_rule.max, Some(SchemaScalar::Float(2.5)));
                  assert_eq!(
                      float_rule.allowed.as_deref(),
                      Some(
                          [
                              SchemaScalar::Integer(1),
                              SchemaScalar::Float(1.5),
                              SchemaScalar::Integer(2),
                          ]
                          .as_slice()
                      )
                  );

                  let boolean_rule = &schema.variables["DEBUG"];
                  assert_eq!(boolean_rule.r#type, VariableType::Boolean);
                  assert_eq!(
                      boolean_rule.allowed.as_deref(),
                      Some(
                          [SchemaScalar::Boolean(true), SchemaScalar::Boolean(false)].as_slice()
                      )
                  );
              }

              #[test]
              fn required_and_allow_empty_default_to_false() {
                  let schema = parse_schema(
                      r#"
          version = 1

          [variables.OPTIONAL]
          type = "string"
          "#,
                  );

                  let rule = &schema.variables["OPTIONAL"];
                  assert!(!rule.required);
                  assert!(!rule.allow_empty);
                  assert_eq!(rule.min, None);
                  assert_eq!(rule.max, None);
                  assert_eq!(rule.min_length, None);
                  assert_eq!(rule.max_length, None);
                  assert_eq!(rule.allowed, None);
                  assert_eq!(rule.pattern, None);
              }
          }
          RS

      - name: Author T019 presence tests
        shell: bash
        run: |
          set -euo pipefail
          cat >> src/validation/rules/presence.rs <<'RS'

          #[cfg(test)]
          mod schema_tests {
              use crate::env::EnvEntry;
              use crate::validation::error::{RuleCode, Severity};

              use super::validate_schema_presence;

              fn entry(value: &str) -> EnvEntry {
                  EnvEntry {
                      key: "VALUE".to_owned(),
                      value: value.to_owned(),
                      line: 7,
                  }
              }

              fn has_error(result: &crate::validation::ValidationResult, code: RuleCode) -> bool {
                  result.diagnostics.iter().any(|diagnostic| {
                      diagnostic.severity == Severity::Error && diagnostic.code == code
                  })
              }

              #[test]
              fn missing_required_variable_is_an_error_and_skips_value_rules() {
                  let (result, skip_value_rules) =
                      validate_schema_presence("VALUE", None, true, false);

                  assert!(has_error(&result, RuleCode::MissingRequired));
                  assert!(skip_value_rules);
              }

              #[test]
              fn missing_optional_variable_is_valid_and_skips_value_rules() {
                  let (result, skip_value_rules) =
                      validate_schema_presence("VALUE", None, false, false);

                  assert!(!result.has_errors());
                  assert!(result.diagnostics.is_empty());
                  assert!(skip_value_rules);
              }

              #[test]
              fn existing_empty_value_is_an_error_when_empty_is_not_allowed() {
                  let value = entry("");
                  let (result, skip_value_rules) =
                      validate_schema_presence("VALUE", Some(&value), true, false);

                  assert!(has_error(&result, RuleCode::EmptyNotAllowed));
                  assert!(skip_value_rules);
              }

              #[test]
              fn existing_empty_value_is_valid_and_short_circuits_when_allowed() {
                  let value = entry("");
                  let (result, skip_value_rules) =
                      validate_schema_presence("VALUE", Some(&value), true, true);

                  assert!(!result.has_errors());
                  assert!(result.diagnostics.is_empty());
                  assert!(skip_value_rules);
              }

              #[test]
              fn existing_non_empty_value_continues_to_type_and_value_rules() {
                  let value = entry("synthetic-non-empty");
                  let (result, skip_value_rules) =
                      validate_schema_presence("VALUE", Some(&value), true, true);

                  assert!(!result.has_errors());
                  assert!(!skip_value_rules);
              }
          }
          RS

      - name: Author T020 scalar type tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/rules/value_type.rs <<'RS'
          // Placeholder module for scalar type rules. Behavior begins in later phases.

          #[cfg(test)]
          mod tests {
              use crate::schema::model::{SchemaScalar, VariableType};
              use crate::validation::error::RuleCode;

              use super::parse_scalar;

              fn assert_type_mismatch(value: &str, variable_type: VariableType) {
                  assert_eq!(
                      parse_scalar(value, variable_type),
                      Err(RuleCode::TypeMismatch)
                  );
              }

              #[test]
              fn string_values_preserve_parsed_text() {
                  assert_eq!(
                      parse_scalar("hello world", VariableType::String),
                      Ok(SchemaScalar::String("hello world".to_owned()))
                  );
              }

              #[test]
              fn integer_accepts_full_i64_boundaries() {
                  assert_eq!(
                      parse_scalar(&i64::MIN.to_string(), VariableType::Integer),
                      Ok(SchemaScalar::Integer(i64::MIN))
                  );
                  assert_eq!(
                      parse_scalar(&i64::MAX.to_string(), VariableType::Integer),
                      Ok(SchemaScalar::Integer(i64::MAX))
                  );
              }

              #[test]
              fn integer_rejects_underflow_overflow_decimal_and_scientific_notation() {
                  for value in [
                      "-9223372036854775809",
                      "9223372036854775808",
                      "1.0",
                      "1e3",
                      "-2E4",
                  ] {
                      assert_type_mismatch(value, VariableType::Integer);
                  }
              }

              #[test]
              fn float_accepts_finite_decimal_and_scientific_notation() {
                  assert_eq!(
                      parse_scalar("1.5", VariableType::Float),
                      Ok(SchemaScalar::Float(1.5))
                  );
                  assert_eq!(
                      parse_scalar("1.5e2", VariableType::Float),
                      Ok(SchemaScalar::Float(150.0))
                  );
                  assert_eq!(
                      parse_scalar("-2E-1", VariableType::Float),
                      Ok(SchemaScalar::Float(-0.2))
                  );
              }

              #[test]
              fn float_rejects_nan_positive_infinity_negative_infinity_and_overflow() {
                  for value in ["NaN", "inf", "+inf", "-inf", "1e400", "-1e400"] {
                      assert_type_mismatch(value, VariableType::Float);
                  }
              }

              #[test]
              fn boolean_accepts_true_false_case_insensitively_only() {
                  for value in ["true", "TRUE", "True", "tRuE"] {
                      assert_eq!(
                          parse_scalar(value, VariableType::Boolean),
                          Ok(SchemaScalar::Boolean(true))
                      );
                  }
                  for value in ["false", "FALSE", "False", "fAlSe"] {
                      assert_eq!(
                          parse_scalar(value, VariableType::Boolean),
                          Ok(SchemaScalar::Boolean(false))
                      );
                  }
                  for value in ["1", "0", "yes", "no", "on", "off"] {
                      assert_type_mismatch(value, VariableType::Boolean);
                  }
              }
          }
          RS

      - name: Author T021 numeric boundary tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/rules/numeric.rs <<'RS'
          // Placeholder module for numeric rules. Behavior begins in later phases.

          #[cfg(test)]
          mod tests {
              use crate::validation::error::RuleCode;

              use super::{validate_float_bounds, validate_integer_bounds};

              #[test]
              fn integer_min_and_max_are_inclusive_with_adjacent_values_rejected() {
                  assert!(validate_integer_bounds(10, Some(10), Some(20)).is_empty());
                  assert!(validate_integer_bounds(20, Some(10), Some(20)).is_empty());
                  assert_eq!(
                      validate_integer_bounds(9, Some(10), Some(20)),
                      vec![RuleCode::BelowMin]
                  );
                  assert_eq!(
                      validate_integer_bounds(21, Some(10), Some(20)),
                      vec![RuleCode::AboveMax]
                  );
              }

              #[test]
              fn integer_bound_comparison_preserves_i64_precision_beyond_f64_exact_range() {
                  let exact = 9_007_199_254_740_993_i64;
                  assert!(validate_integer_bounds(exact, Some(exact), Some(exact)).is_empty());
                  assert_eq!(
                      validate_integer_bounds(exact - 1, Some(exact), None),
                      vec![RuleCode::BelowMin]
                  );
                  assert_eq!(
                      validate_integer_bounds(exact + 1, None, Some(exact)),
                      vec![RuleCode::AboveMax]
                  );
              }

              #[test]
              fn float_min_and_max_are_inclusive_with_next_representable_values_rejected() {
                  let min = 1.0_f64;
                  let max = 2.0_f64;
                  let just_below_min = f64::from_bits(min.to_bits() - 1);
                  let just_above_max = f64::from_bits(max.to_bits() + 1);

                  assert!(validate_float_bounds(min, Some(min), Some(max)).is_empty());
                  assert!(validate_float_bounds(max, Some(min), Some(max)).is_empty());
                  assert_eq!(
                      validate_float_bounds(just_below_min, Some(min), Some(max)),
                      vec![RuleCode::BelowMin]
                  );
                  assert_eq!(
                      validate_float_bounds(just_above_max, Some(min), Some(max)),
                      vec![RuleCode::AboveMax]
                  );
              }
          }
          RS

      - name: Author T022 Unicode length tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/rules/length.rs <<'RS'
          // Placeholder module for string-length rules. Behavior begins in later phases.

          #[cfg(test)]
          mod tests {
              use crate::validation::error::RuleCode;

              use super::validate_string_length;

              #[test]
              fn unicode_length_counts_scalar_values_not_utf8_bytes() {
                  let value = "é🦀";
                  assert_eq!(value.len(), 6);
                  assert_eq!(value.chars().count(), 2);
                  assert!(validate_string_length(value, Some(2), Some(2)).is_empty());
              }

              #[test]
              fn min_length_is_inclusive_and_one_scalar_below_is_rejected() {
                  assert!(validate_string_length("é🦀", Some(2), None).is_empty());
                  assert_eq!(
                      validate_string_length("é", Some(2), None),
                      vec![RuleCode::TooShort]
                  );
              }

              #[test]
              fn max_length_is_inclusive_and_one_scalar_above_is_rejected() {
                  assert!(validate_string_length("é🦀", None, Some(2)).is_empty());
                  assert_eq!(
                      validate_string_length("é🦀x", None, Some(2)),
                      vec![RuleCode::TooLong]
                  );
              }
          }
          RS

      - name: Author T023 typed allowed tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/rules/allowed.rs <<'RS'
          // Placeholder module for allowed-value rules. Behavior begins in later phases.

          #[cfg(test)]
          mod tests {
              use crate::schema::model::{SchemaScalar, VariableType};

              use super::is_allowed;

              #[test]
              fn string_allowed_comparison_is_case_sensitive() {
                  let allowed = [SchemaScalar::String("prod".to_owned())];
                  assert!(is_allowed(
                      &SchemaScalar::String("prod".to_owned()),
                      &allowed,
                      VariableType::String
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::String("PROD".to_owned()),
                      &allowed,
                      VariableType::String
                  ));
              }

              #[test]
              fn integer_allowed_comparison_preserves_i64_without_f64_coercion() {
                  let allowed = [SchemaScalar::Integer(9_007_199_254_740_993)];
                  assert!(is_allowed(
                      &SchemaScalar::Integer(9_007_199_254_740_993),
                      &allowed,
                      VariableType::Integer
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::Integer(9_007_199_254_740_992),
                      &allowed,
                      VariableType::Integer
                  ));
              }

              #[test]
              fn float_allowed_comparison_accepts_finite_toml_integer_or_float_entries() {
                  let allowed = [SchemaScalar::Integer(1), SchemaScalar::Float(2.5)];
                  assert!(is_allowed(
                      &SchemaScalar::Float(1.0),
                      &allowed,
                      VariableType::Float
                  ));
                  assert!(is_allowed(
                      &SchemaScalar::Float(2.5),
                      &allowed,
                      VariableType::Float
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::Float(3.0),
                      &allowed,
                      VariableType::Float
                  ));
              }

              #[test]
              fn boolean_allowed_comparison_uses_boolean_meaning() {
                  let allowed = [SchemaScalar::Boolean(true)];
                  assert!(is_allowed(
                      &SchemaScalar::Boolean(true),
                      &allowed,
                      VariableType::Boolean
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::Boolean(false),
                      &allowed,
                      VariableType::Boolean
                  ));
              }

              #[test]
              fn incompatible_scalar_kinds_are_never_implicitly_coerced() {
                  assert!(!is_allowed(
                      &SchemaScalar::Integer(1),
                      &[SchemaScalar::String("1".to_owned())],
                      VariableType::Integer
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::Boolean(true),
                      &[SchemaScalar::String("true".to_owned())],
                      VariableType::Boolean
                  ));
                  assert!(!is_allowed(
                      &SchemaScalar::String("1".to_owned()),
                      &[SchemaScalar::Integer(1)],
                      VariableType::String
                  ));
              }
          }
          RS

      - name: Author T024 regex matching tests
        shell: bash
        run: |
          set -euo pipefail
          cat > src/validation/rules/pattern.rs <<'RS'
          // Placeholder module for pattern rules. Behavior begins in later phases.

          #[cfg(test)]
          mod tests {
              use regex::Regex;

              use super::matches_pattern;

              #[test]
              fn pattern_uses_regex_is_match_substring_semantics_without_implicit_anchors() {
                  let regex = Regex::new("cat").expect("valid regex");
                  assert!(matches_pattern("concatenate", &regex));
              }

              #[test]
              fn schema_authored_anchors_are_respected() {
                  let regex = Regex::new("^cat$").expect("valid regex");
                  assert!(matches_pattern("cat", &regex));
                  assert!(!matches_pattern("concatenate", &regex));
              }
          }
          RS

      - name: Author T025 compiled CLI schema tests
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/cli.rs <<'RS'

          struct SchemaFixture {
              _directory: TempDir,
              target: PathBuf,
              schema: PathBuf,
          }

          impl SchemaFixture {
              fn new(target: &str, schema: &str) -> Self {
                  let directory = tempfile::tempdir().expect("temporary directory");
                  let target_path = directory.path().join(".env");
                  let schema_path = directory.path().join(".env.schema");
                  fs::write(&target_path, target).expect("write target dotenv");
                  fs::write(&schema_path, schema).expect("write env schema");
                  Self {
                      _directory: directory,
                      target: target_path,
                      schema: schema_path,
                  }
              }
          }

          fn run_schema(target: &Path, schema: &Path) -> Output {
              let mut command = Command::cargo_bin("envcheck").expect("compiled envcheck binary");
              command.arg(target).arg("--schema").arg(schema);
              command.output().expect("execute envcheck")
          }

          #[test]
          fn schema_complete_valid_contract_accepts_all_types_and_dotenv_forms() {
              let fixture = SchemaFixture::new(
                  "APP_NAME=\"My Application\"\nAPP_PORT=65535\nREQUEST_TIMEOUT=1.5e1\nDEBUG=TrUe\nHOST=api.internal\nEMPTY_OK=\nLITERAL=${NAME}\nexport EXPORTED=enabled\n",
                  r#"
          version = 1

          [variables.APP_NAME]
          type = "string"
          required = true
          min_length = 2
          max_length = 20
          allowed = ["My Application"]

          [variables.APP_PORT]
          type = "integer"
          required = true
          min = 1
          max = 65535
          allowed = [65535]

          [variables.REQUEST_TIMEOUT]
          type = "float"
          required = true
          min = 0.1
          max = 60.0
          allowed = [15, 15.0]

          [variables.DEBUG]
          type = "boolean"
          required = true
          allowed = [true]

          [variables.HOST]
          type = "string"
          required = true
          pattern = "api\\.internal"

          [variables.EMPTY_OK]
          type = "integer"
          required = true
          allow_empty = true
          min = 10

          [variables.LITERAL]
          type = "string"
          required = true
          allowed = ["${NAME}"]

          [variables.EXPORTED]
          type = "string"
          required = true
          allowed = ["enabled"]

          [variables.OPTIONAL]
          type = "boolean"
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(0));
              assert!(stdout(&output).contains("ok: environment validation succeeded"));
              assert!(stderr(&output).is_empty());
              assert_target_values_redacted(
                  &output,
                  &["My Application", "api.internal", "${NAME}", "enabled"],
              );
          }

          #[test]
          fn schema_required_missing_is_a_validation_error() {
              let fixture = SchemaFixture::new(
                  "",
                  r#"
          version = 1
          [variables.REQUIRED_VALUE]
          type = "string"
          required = true
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(1));
              assert!(stdout(&output).contains("REQUIRED_VALUE"));
              assert!(stdout(&output).contains("missing"));
              assert!(stderr(&output).is_empty());
          }

          #[test]
          fn schema_existing_empty_is_distinct_and_rejected_when_not_allowed() {
              let fixture = SchemaFixture::new(
                  "REQUIRED_VALUE=\n",
                  r#"
          version = 1
          [variables.REQUIRED_VALUE]
          type = "string"
          required = true
          allow_empty = false
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(1));
              assert!(stdout(&output).contains("REQUIRED_VALUE"));
              assert!(stdout(&output).contains("empty"));
              assert!(stderr(&output).is_empty());
          }

          #[test]
          fn schema_optional_missing_variable_is_valid() {
              let fixture = SchemaFixture::new(
                  "",
                  r#"
          version = 1
          [variables.OPTIONAL_VALUE]
          type = "integer"
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(0));
              assert!(stdout(&output).contains("ok: environment validation succeeded"));
          }

          #[test]
          fn schema_integer_and_float_bounds_are_inclusive_and_reject_outside_values() {
              let integer_schema = r#"
          version = 1
          [variables.VALUE]
          type = "integer"
          required = true
          min = 10
          max = 20
          "#;
              for value in ["10", "20"] {
                  let fixture = SchemaFixture::new(&format!("VALUE={value}\n"), integer_schema);
                  assert_eq!(run_schema(&fixture.target, &fixture.schema).status.code(), Some(0));
              }
              for value in ["9", "21"] {
                  let fixture = SchemaFixture::new(&format!("VALUE={value}\n"), integer_schema);
                  assert_eq!(run_schema(&fixture.target, &fixture.schema).status.code(), Some(1));
              }

              let float_schema = r#"
          version = 1
          [variables.VALUE]
          type = "float"
          required = true
          min = 0.5
          max = 1.5
          "#;
              for value in ["0.5", "1.5"] {
                  let fixture = SchemaFixture::new(&format!("VALUE={value}\n"), float_schema);
                  assert_eq!(run_schema(&fixture.target, &fixture.schema).status.code(), Some(0));
              }
              for value in ["0.49", "1.51"] {
                  let fixture = SchemaFixture::new(&format!("VALUE={value}\n"), float_schema);
                  assert_eq!(run_schema(&fixture.target, &fixture.schema).status.code(), Some(1));
              }
          }

          #[test]
          fn schema_unicode_scalar_lengths_enforce_exact_and_adjacent_boundaries() {
              let schema = r#"
          version = 1
          [variables.TEXT]
          type = "string"
          required = true
          min_length = 2
          max_length = 2
          "#;

              let exact = SchemaFixture::new("TEXT=é🦀\n", schema);
              assert_eq!(run_schema(&exact.target, &exact.schema).status.code(), Some(0));

              let below = SchemaFixture::new("TEXT=é\n", schema);
              assert_eq!(run_schema(&below.target, &below.schema).status.code(), Some(1));

              let above = SchemaFixture::new("TEXT=é🦀x\n", schema);
              assert_eq!(run_schema(&above.target, &above.schema).status.code(), Some(1));
          }

          #[test]
          fn schema_typed_allowed_values_preserve_scalar_semantics() {
              let schema = r#"
          version = 1
          [variables.MODE]
          type = "string"
          required = true
          allowed = ["prod"]

          [variables.BIG]
          type = "integer"
          required = true
          allowed = [9007199254740993]

          [variables.RATIO]
          type = "float"
          required = true
          allowed = [1, 2.5]

          [variables.ENABLED]
          type = "boolean"
          required = true
          allowed = [true]
          "#;

              let valid = SchemaFixture::new(
                  "MODE=prod\nBIG=9007199254740993\nRATIO=1.0\nENABLED=TRUE\n",
                  schema,
              );
              assert_eq!(run_schema(&valid.target, &valid.schema).status.code(), Some(0));

              let wrong_case = SchemaFixture::new(
                  "MODE=PROD\nBIG=9007199254740993\nRATIO=1.0\nENABLED=TRUE\n",
                  schema,
              );
              assert_eq!(
                  run_schema(&wrong_case.target, &wrong_case.schema).status.code(),
                  Some(1)
              );
          }

          #[test]
          fn schema_pattern_uses_regex_is_match_without_implicit_anchors() {
              let unanchored = SchemaFixture::new(
                  "VALUE=concatenate\n",
                  r#"
          version = 1
          [variables.VALUE]
          type = "string"
          required = true
          pattern = "cat"
          "#,
              );
              assert_eq!(
                  run_schema(&unanchored.target, &unanchored.schema).status.code(),
                  Some(0)
              );

              let anchored = SchemaFixture::new(
                  "VALUE=concatenate\n",
                  r#"
          version = 1
          [variables.VALUE]
          type = "string"
          required = true
          pattern = "^cat$"
          "#,
              );
              assert_eq!(
                  run_schema(&anchored.target, &anchored.schema).status.code(),
                  Some(1)
              );
          }

          #[test]
          fn schema_additional_target_variable_warns_without_failing_or_disclosing_value() {
              let fixture = SchemaFixture::new(
                  "KNOWN=synthetic-known\nEXTRA=synthetic-extra-secret\n",
                  r#"
          version = 1
          [variables.KNOWN]
          type = "string"
          required = true
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(0));
              assert!(stdout(&output).contains("warning"));
              assert!(stdout(&output).contains("EXTRA"));
              assert_target_values_redacted(
                  &output,
                  &["synthetic-known", "synthetic-extra-secret"],
              );
          }

          #[test]
          fn schema_integer_outside_i64_range_is_rejected_without_value_disclosure() {
              let fixture = SchemaFixture::new(
                  "VALUE=9223372036854775808\n",
                  r#"
          version = 1
          [variables.VALUE]
          type = "integer"
          required = true
          "#,
              );

              let output = run_schema(&fixture.target, &fixture.schema);

              assert_eq!(output.status.code(), Some(1));
              assert!(stdout(&output).contains("VALUE"));
              assert_target_values_redacted(&output, &["9223372036854775808"]);
          }

          #[test]
          fn schema_non_finite_and_overflowing_float_representations_are_rejected() {
              let schema = r#"
          version = 1
          [variables.VALUE]
          type = "float"
          required = true
          "#;

              for value in ["NaN", "+inf", "-inf", "1e400"] {
                  let fixture = SchemaFixture::new(&format!("VALUE={value}\n"), schema);
                  let output = run_schema(&fixture.target, &fixture.schema);
                  assert_eq!(output.status.code(), Some(1), "value {value} must fail");
                  assert!(stdout(&output).contains("VALUE"));
                  assert_target_values_redacted(&output, &[value]);
              }
          }
          RS

      - name: Format test sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check

      - name: Observe required RED validation
        shell: bash
        run: |
          set +e
          set -u
          cargo test --lib > /tmp/cargo-test-lib.log 2>&1
          lib_status=$?
          cargo test --bin envcheck > /tmp/cargo-test-bin.log 2>&1
          unit_status=$?
          cargo test --test cli > /tmp/cargo-test-cli.log 2>&1
          cli_status=$?
          set -e

          echo "cargo test --lib status: $lib_status"
          cat /tmp/cargo-test-lib.log
          echo "cargo test --bin envcheck status: $unit_status"
          cat /tmp/cargo-test-bin.log
          echo "cargo test --test cli status: $cli_status"
          cat /tmp/cargo-test-cli.log

          test "$lib_status" -ne 0
          grep -F 'no library targets found' /tmp/cargo-test-lib.log

          test "$unit_status" -ne 0
          grep -E 'SchemaDefinition|validate_schema_presence|parse_scalar|validate_integer_bounds|validate_string_length|is_allowed|matches_pattern' /tmp/cargo-test-bin.log

          test "$cli_status" -ne 0
          grep -E 'schema_.*FAILED|test schema_.*\.\.\. FAILED' /tmp/cargo-test-cli.log

      - name: Confirm existing US1 and production build remain green
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          cargo test --test cli -- --skip schema_

      - name: Mark only T018 through T025 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-env-validation/tasks.md')
          text = path.read_text()
          for n in range(18, 26):
              task = f'T{n:03d}'
              old = f'- [ ] {task} '
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unchecked {task}')
              text = text.replace(old, f'- [X] {task} ', 1)
          if '- [ ] T026 ' not in text:
              raise SystemExit('T026 must remain unchecked')
          path.write_text(text)
          PY

      - name: Verify scope and commit RED tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .specify/extensions.yml
          rm .github/workflows/us2-red.yml
          cargo fmt --check
          cargo check
          cargo test --test cli -- --skip schema_

          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/schema/model.rs',
              'src/validation/rules/presence.rs',
              'src/validation/rules/value_type.rs',
              'src/validation/rules/numeric.rs',
              'src/validation/rules/length.rs',
              'src/validation/rules/allowed.rs',
              'src/validation/rules/pattern.rs',
              'tests/cli.rs',
              'specs/001-env-validation/tasks.md',
              '.github/workflows/us2-red.yml',
          }
          paths = []
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          unexpected = sorted(set(paths) - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {unexpected}')
          print('Changed paths:', ', '.join(paths))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: define typed env schema validation behavior'
          git push origin HEAD:chore/init-spec-kit
