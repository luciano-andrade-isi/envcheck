name: Foundational Green

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/foundational-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify prerequisites and checklist gate
        shell: bash
        run: |
          set -euo pipefail
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          for task in T001 T002 T003 T004 T005; do
            grep -F -- "- [X] $task " specs/001-env-validation/tasks.md
          done
          for task in T006 T007 T008 T009 T010 T011 T012; do
            grep -F -- "- [ ] $task " specs/001-env-validation/tasks.md
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path('specs/001-env-validation/checklists').glob('*.md')):
              text = path.read_text()
              total = len(re.findall(r'^- \[(?: |X|x)\] ', text, flags=re.M))
              checked = len(re.findall(r'^- \[(?:X|x)\] ', text, flags=re.M))
              unchecked = len(re.findall(r'^- \[ \] ', text, flags=re.M))
              print(f'{path.name}: total={total} checked={checked} unchecked={unchecked}')
              if unchecked:
                  raise SystemExit(f'Checklist gate failed: {path} has {unchecked} unchecked items')
          PY
          git rev-parse --git-dir >/dev/null
          grep -Eq '^(target|target/|/target/?)$' .gitignore
          grep -F '**/*.rs.bk' .gitignore
          test ! -e .specify/extensions.yml

      - name: Implement T006 EnvDocument model
        shell: bash
        run: |
          cat > src/env/mod.rs <<'RS'
          use std::collections::BTreeMap;
          use std::path::PathBuf;

          pub(crate) mod parser;

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct EnvEntry {
              pub(crate) key: String,
              pub(crate) value: String,
              pub(crate) line: usize,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct EnvDocument {
              pub(crate) path: PathBuf,
              pub(crate) entries: Vec<EnvEntry>,
              pub(crate) key_index: BTreeMap<String, Vec<usize>>,
          }

          impl EnvDocument {
              pub(crate) fn new(path: PathBuf, entries: Vec<EnvEntry>) -> Self {
                  let mut key_index = BTreeMap::<String, Vec<usize>>::new();
                  for (index, entry) in entries.iter().enumerate() {
                      key_index.entry(entry.key.clone()).or_default().push(index);
                  }

                  Self {
                      path,
                      entries,
                      key_index,
                  }
              }
          }
          RS

      - name: Implement T007 dotenv parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/env/parser.rs')
          tests = path.read_text()
          implementation = r'''use std::fmt;
          use std::path::{Path, PathBuf};

          use dotenvx_primitives::{ScanOptions, scan};

          use super::{EnvDocument, EnvEntry};

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct DotenvParseError {
              pub(crate) path: PathBuf,
              pub(crate) reason: &'static str,
              pub(crate) line: Option<usize>,
              pub(crate) column: Option<usize>,
          }

          impl DotenvParseError {
              fn at_line(path: &Path, line: usize, reason: &'static str) -> Self {
                  Self {
                      path: path.to_path_buf(),
                      reason,
                      line: Some(line),
                      column: None,
                  }
              }
          }

          impl fmt::Display for DotenvParseError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(formatter, "{}: {}", self.path.display(), self.reason)?;
                  if let Some(line) = self.line {
                      write!(formatter, " at line {line}")?;
                      if let Some(column) = self.column {
                          write!(formatter, ", column {column}")?;
                      }
                  }
                  Ok(())
              }
          }

          impl std::error::Error for DotenvParseError {}

          pub(crate) fn parse_dotenv(
              path: &Path,
              input: &str,
          ) -> Result<EnvDocument, DotenvParseError> {
              let normalized = input.replace("\r\n", "\n").replace('\r', "\n");
              let mut entries = Vec::new();

              for (line_index, line) in normalized.lines().enumerate() {
                  let line_number = line_index + 1;
                  let trimmed = line.trim();
                  if trimmed.is_empty() || trimmed.starts_with('#') {
                      continue;
                  }

                  let (key, raw_value) = assignment_parts(line).ok_or_else(|| {
                      DotenvParseError::at_line(path, line_number, "invalid dotenv declaration")
                  })?;

                  if !is_valid_identifier(key) {
                      return Err(DotenvParseError::at_line(
                          path,
                          line_number,
                          "invalid variable name",
                      ));
                  }

                  if quoted_value_is_unterminated(raw_value) {
                      return Err(DotenvParseError::at_line(
                          path,
                          line_number,
                          "unterminated quoted value",
                      ));
                  }

                  let scanned = scan(line, &ScanOptions::default());
                  let scanned_value = scanned
                      .parsed
                      .get(key)
                      .and_then(|values| (values.len() == 1).then(|| values[0].clone()))
                      .ok_or_else(|| {
                          DotenvParseError::at_line(
                              path,
                              line_number,
                              "invalid dotenv declaration",
                          )
                      })?;

                  let value = if starts_with_supported_quote(raw_value) {
                      scanned_value
                  } else {
                      clean_unquoted_value(raw_value)
                  };

                  entries.push(EnvEntry {
                      key: key.to_owned(),
                      value,
                      line: line_number,
                  });
              }

              Ok(EnvDocument::new(path.to_path_buf(), entries))
          }

          fn assignment_parts(line: &str) -> Option<(&str, &str)> {
              let mut input = line.trim_start();
              if let Some(rest) = input.strip_prefix("export ") {
                  input = rest.trim_start();
              }

              let equals = input.find('=')?;
              let key = input[..equals].trim();
              if key.is_empty() {
                  return None;
              }

              Some((key, &input[equals + 1..]))
          }

          fn is_valid_identifier(name: &str) -> bool {
              let mut characters = name.chars();
              let Some(first) = characters.next() else {
                  return false;
              };

              (first.is_ascii_alphabetic() || first == '_')
                  && characters.all(|character| character.is_ascii_alphanumeric() || character == '_')
          }

          fn starts_with_supported_quote(raw_value: &str) -> bool {
              matches!(raw_value.trim_start().chars().next(), Some('\'' | '"'))
          }

          fn quoted_value_is_unterminated(raw_value: &str) -> bool {
              let input = raw_value.trim_start();
              let Some(quote @ ('\'' | '"')) = input.chars().next() else {
                  return false;
              };

              let mut escaped = false;
              for character in input[quote.len_utf8()..].chars() {
                  if character == quote && !escaped {
                      return false;
                  }
                  escaped = character == '\\' && !escaped;
                  if character != '\\' {
                      escaped = false;
                  }
              }

              true
          }

          fn clean_unquoted_value(raw_value: &str) -> String {
              let input = raw_value.trim();
              for (index, character) in input.char_indices() {
                  if character != '#' {
                      continue;
                  }

                  let preceded_by_whitespace = input[..index]
                      .chars()
                      .next_back()
                      .is_some_and(char::is_whitespace);
                  if preceded_by_whitespace {
                      return input[..index].trim_end().to_owned();
                  }
              }

              input.to_owned()
          }

          '''
          path.write_text(implementation + tests)
          PY

      - name: Implement T008 and T009 diagnostics
        shell: bash
        run: |
          cat > src/validation/error.rs <<'RS'
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum Severity {
              Error,
              Warning,
          }

          impl Severity {
              pub(crate) const fn sort_rank(self) -> u8 {
                  match self {
                      Self::Error => 0,
                      Self::Warning => 1,
                  }
              }

              pub(crate) const fn as_str(self) -> &'static str {
                  match self {
                      Self::Error => "error",
                      Self::Warning => "warning",
                  }
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum RuleCode {
              DuplicateKey,
              MissingRequired,
              EmptyNotAllowed,
              TypeMismatch,
              BelowMin,
              AboveMax,
              TooShort,
              TooLong,
              NotAllowed,
              PatternMismatch,
              AdditionalVariable,
          }

          impl RuleCode {
              pub(crate) const fn as_str(self) -> &'static str {
                  match self {
                      Self::DuplicateKey => "duplicate_key",
                      Self::MissingRequired => "missing_required",
                      Self::EmptyNotAllowed => "empty_not_allowed",
                      Self::TypeMismatch => "type_mismatch",
                      Self::BelowMin => "below_min",
                      Self::AboveMax => "above_max",
                      Self::TooShort => "too_short",
                      Self::TooLong => "too_long",
                      Self::NotAllowed => "not_allowed",
                      Self::PatternMismatch => "pattern_mismatch",
                      Self::AdditionalVariable => "additional_variable",
                  }
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct Diagnostic {
              pub(crate) severity: Severity,
              pub(crate) code: RuleCode,
              pub(crate) variable: Option<String>,
              pub(crate) rule: String,
              pub(crate) expected: Option<String>,
              pub(crate) line: Option<usize>,
          }
          RS

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/validation/mod.rs')
          text = path.read_text()
          marker = '#[cfg(test)]\nmod tests {'
          tests = text[text.index(marker):]
          implementation = '''pub(crate) mod error;\npub(crate) mod rules;\npub(crate) mod validator;\n\nuse error::Severity;\n\n#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub(crate) struct ValidationResult {\n    pub(crate) diagnostics: Vec<error::Diagnostic>,\n}\n\nimpl ValidationResult {\n    pub(crate) fn has_errors(&self) -> bool {\n        self.diagnostics\n            .iter()\n            .any(|diagnostic| diagnostic.severity == Severity::Error)\n    }\n\n    pub(crate) fn sort_diagnostics(&mut self) {\n        self.diagnostics.sort_by(|left, right| {\n            left.severity\n                .sort_rank()\n                .cmp(&right.severity.sort_rank())\n                .then_with(|| left.variable.cmp(&right.variable))\n                .then_with(|| left.code.as_str().cmp(right.code.as_str()))\n                .then_with(|| left.line.cmp(&right.line))\n        });\n    }\n}\n\n'''
          path.write_text(implementation + tests)
          PY

      - name: Implement T010 CLI model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/cli.rs')
          tests = path.read_text()
          implementation = r'''use std::path::PathBuf;

          use clap::Parser;

          #[derive(Debug, Parser)]
          #[command(name = "envcheck", version, about = "Validate environment files")]
          pub(crate) struct Cli {
              #[arg(value_name = "ENV_FILE")]
              pub(crate) env_file: PathBuf,

              #[arg(long, value_name = "FILE", conflicts_with = "schema")]
              pub(crate) example: Option<PathBuf>,

              #[arg(long, value_name = "FILE", conflicts_with = "example")]
              pub(crate) schema: Option<PathBuf>,
          }

          '''
          path.write_text(implementation + tests)
          PY

      - name: Implement T011 rendering primitives
        shell: bash
        run: |
          cat > src/output/mod.rs <<'RS'
          use std::io::{self, Write};

          use crate::PreventingFailure;
          use crate::validation::ValidationResult;
          use crate::validation::error::Diagnostic;

          pub(crate) fn render_diagnostic(diagnostic: &Diagnostic) -> String {
              let mut rendered = format!("{}: ", diagnostic.severity.as_str());
              if let Some(variable) = &diagnostic.variable {
                  rendered.push_str(variable);
                  rendered.push_str(": ");
              }
              rendered.push_str(&diagnostic.rule);
              if let Some(expected) = &diagnostic.expected {
                  rendered.push_str(" (expected ");
                  rendered.push_str(expected);
                  rendered.push(')');
              }
              rendered
          }

          pub(crate) fn render_validation_result(result: &ValidationResult) -> String {
              let mut rendered = String::new();
              for diagnostic in &result.diagnostics {
                  rendered.push_str(&render_diagnostic(diagnostic));
                  rendered.push('\n');
              }

              if !result.has_errors() {
                  rendered.push_str("ok: environment validation succeeded\n");
              }

              rendered
          }

          pub(crate) fn render_preventing_failure(failure: &PreventingFailure) -> String {
              let mut location = failure.path.display().to_string();
              if let Some(line) = failure.line {
                  location.push(':');
                  location.push_str(&line.to_string());
                  if let Some(column) = failure.column {
                      location.push(':');
                      location.push_str(&column.to_string());
                  }
              }

              format!(
                  "error: {}: {}: {}\n",
                  failure.category, location, failure.reason
              )
          }

          pub(crate) fn write_validation_stdout(result: &ValidationResult) -> io::Result<()> {
              let rendered = render_validation_result(result);
              io::stdout().lock().write_all(rendered.as_bytes())
          }

          pub(crate) fn write_preventing_stderr(failure: &PreventingFailure) -> io::Result<()> {
              let rendered = render_preventing_failure(failure);
              io::stderr().lock().write_all(rendered.as_bytes())
          }
          RS

      - name: Implement T012 orchestration shell
        shell: bash
        run: |
          cat > src/main.rs <<'RS'
          use std::fmt;
          use std::path::PathBuf;
          use std::process::ExitCode;

          use clap::Parser;

          mod cli;
          // Foundational parser/domain APIs are wired into story flows by later tasks.
          #[allow(dead_code)]
          mod env;
          // Foundational rendering primitives are wired into story flows by later tasks.
          #[allow(dead_code)]
          mod output;
          mod schema;
          // Foundational validation APIs are wired into story flows by later tasks.
          #[allow(dead_code)]
          mod validation;

          pub(crate) const EXIT_SUCCESS: u8 = 0;
          // Stable public exit constants are defined now and consumed by later orchestration tasks.
          #[allow(dead_code)]
          pub(crate) const EXIT_VALIDATION_ERROR: u8 = 1;
          #[allow(dead_code)]
          pub(crate) const EXIT_CLI_USAGE_ERROR: u8 = 2;
          #[allow(dead_code)]
          pub(crate) const EXIT_INPUT_ERROR: u8 = 3;
          #[allow(dead_code)]
          pub(crate) const EXIT_SCHEMA_ERROR: u8 = 4;

          #[allow(dead_code)]
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum FailureCategory {
              Input,
              Discovery,
              Dotenv,
              Schema,
          }

          impl fmt::Display for FailureCategory {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let name = match self {
                      Self::Input => "input",
                      Self::Discovery => "discovery",
                      Self::Dotenv => "dotenv",
                      Self::Schema => "schema",
                  };
                  formatter.write_str(name)
              }
          }

          #[allow(dead_code)]
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub(crate) enum SafeFailureReason {
              UnreadableFile,
              NoValidationDefinition,
              InvalidDotenvSyntax,
              InvalidSchemaSyntax,
              InvalidSchemaDefinition,
          }

          impl fmt::Display for SafeFailureReason {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let reason = match self {
                      Self::UnreadableFile => "required file could not be read",
                      Self::NoValidationDefinition => "no validation definition is available",
                      Self::InvalidDotenvSyntax => "invalid dotenv syntax",
                      Self::InvalidSchemaSyntax => "invalid schema syntax",
                      Self::InvalidSchemaDefinition => "invalid schema definition",
                  };
                  formatter.write_str(reason)
              }
          }

          #[allow(dead_code)]
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub(crate) struct PreventingFailure {
              pub(crate) category: FailureCategory,
              pub(crate) path: PathBuf,
              pub(crate) reason: SafeFailureReason,
              pub(crate) line: Option<usize>,
              pub(crate) column: Option<usize>,
          }

          fn main() -> ExitCode {
              let cli = cli::Cli::parse();
              let _ = (&cli.env_file, &cli.example, &cli.schema);
              ExitCode::from(EXIT_SUCCESS)
          }
          RS

      - name: Format and validate foundational infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Mark only T006 through T012 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('specs/001-env-validation/tasks.md')
          text = path.read_text()
          for number in range(6, 13):
              task = f'T{number:03d}'
              old = f'- [ ] {task} '
              new = f'- [X] {task} '
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unchecked {task}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          checked = re.findall(r'^- \[(?:X|x)\] (T\d{3})\b', text, flags=re.M)
          expected = [f'T{i:03d}' for i in range(1, 13)]
          if checked != expected:
              raise SystemExit(f'Unexpected checked tasks: {checked}')
          if '- [ ] T013 ' not in text:
              raise SystemExit('T013 must remain unchecked')
          print('Checked task IDs:', ', '.join(checked))
          PY

      - name: Verify scope, post-hooks state, and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/foundational-green.yml
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
          test ! -e .specify/extensions.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/env/mod.rs',
              'src/env/parser.rs',
              'src/validation/error.rs',
              'src/validation/mod.rs',
              'src/cli.rs',
              'src/output/mod.rs',
              'src/main.rs',
              'specs/001-env-validation/tasks.md',
              '.github/workflows/foundational-green.yml',
          }
          paths = []
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          unexpected = sorted(set(paths) - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected changed paths: {unexpected}')
          print('Changed paths:', ', '.join(paths))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add envcheck foundational infrastructure'
          git push origin HEAD:chore/init-spec-kit
