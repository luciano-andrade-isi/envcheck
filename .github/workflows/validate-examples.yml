name: Validate Examples

on:
  push:
    branches:
      - chore/init-spec-kit

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Envcheck
        run: cargo build
      - name: Run all example scenarios
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/envcheck"
          RESULTS="$RUNNER_TEMP/envcheck-example-results.tsv"
          : > "$RESULTS"

          run_case() {
            local name="$1"
            local expected="$2"
            shift 2

            local out="$RUNNER_TEMP/$name.stdout"
            local err="$RUNNER_TEMP/$name.stderr"

            set +e
            "$BIN" "$@" >"$out" 2>"$err"
            local actual=$?
            set -e

            local stdout_summary
            local stderr_summary
            stdout_summary="$(tr '\n' ' ' <"$out" | sed 's/[[:space:]]\+/ /g' | cut -c1-300)"
            stderr_summary="$(tr '\n' ' ' <"$err" | sed 's/[[:space:]]\+/ /g' | cut -c1-300)"

            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$expected" "$actual" "$stdout_summary" "$stderr_summary" >> "$RESULTS"

            if [[ "$actual" -ne "$expected" ]]; then
              echo "::error::$name expected exit $expected but got $actual"
              echo "stdout:"; cat "$out"
              echo "stderr:"; cat "$err"
              exit 1
            fi
          }

          run_case "01-example-only-simple-valid" 0 examples/01-example-only-simple-valid/.env
          run_case "02-example-only-missing-key" 1 examples/02-example-only-missing-key/.env
          run_case "03-schema-only-simple-valid" 0 examples/03-schema-only-simple-valid/.env
          run_case "04-schema-only-complex-valid" 0 examples/04-schema-only-complex-valid/.env
          run_case "05-both-schema-precedence" 1 examples/05-both-schema-precedence/.env
          run_case "06-both-discovery-uses-schema" 1 examples/06-both-explicit-example-override/.env
          run_case "06-both-explicit-example-override" 0 examples/06-both-explicit-example-override/.env --example examples/06-both-explicit-example-override/.env.example
          run_case "07-schema-complex-invalid-values" 1 examples/07-schema-complex-invalid-values/.env
          run_case "08-invalid-schema-definition" 4 examples/08-invalid-schema-definition/.env
          run_case "09-no-definition" 3 examples/09-no-definition/.env

          ! grep -R -F "synthetic-not-an-integer" "$RUNNER_TEMP"/*.stdout "$RUNNER_TEMP"/*.stderr
          ! grep -R -F "synthetic-api-key-12345678901234567890" "$RUNNER_TEMP"/*.stdout "$RUNNER_TEMP"/*.stderr
          ! grep -R -F "synthetic-extra" "$RUNNER_TEMP"/*.stdout "$RUNNER_TEMP"/*.stderr

          echo "RESULTS_BEGIN"
          printf 'case\texpected\tactual\tstdout\tstderr\n'
          cat "$RESULTS"
          echo "RESULTS_END"
