name: Finalize US2

on:
  push:
    branches:
      - chore/init-spec-kit
    paths:
      - .github/workflows/finalize-us2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/init-spec-kit
          fetch-depth: 0
      - name: Mark T034 and T035 and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^- \[ \] T034 /- [X] T034 /' specs/001-env-validation/tasks.md
          sed -i 's/^- \[ \] T035 /- [X] T035 /' specs/001-env-validation/tasks.md
          grep -F -- '- [X] T034 ' specs/001-env-validation/tasks.md
          grep -F -- '- [X] T035 ' specs/001-env-validation/tasks.md
          for n in $(seq -w 36 43); do grep -F -- "- [ ] T0${n} " specs/001-env-validation/tasks.md; done
          rm .github/workflows/finalize-us2.yml .github/workflows/us2-schema-validate.yml
          test ! -e .specify/extensions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: validate env files against typed schema'
          git push origin HEAD:chore/init-spec-kit
